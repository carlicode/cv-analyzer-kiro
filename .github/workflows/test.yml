name: Tests

on:
  push:
    branches: [ main, 2-project-structure, 3-deploy ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Run linter
        run: |
          flake8 . --exclude=venv,env,.venv --max-line-length=120 --count --show-source --statistics
      
      - name: Run tests
        run: |
          pytest -v --tb=short
      
      - name: Check code formatting
        run: |
          black --check . --exclude='/(\.git|\.venv|venv|env|__pycache__)/'

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CV Analyzer API - Serverless Application

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        MAX_FILE_SIZE_MB: 5
        ALLOWED_EXTENSIONS: pdf,txt
        DEFAULT_LANGUAGE: es
  Api:
    BinaryMediaTypes:
      - multipart/form-data
      - application/octet-stream
      - application/pdf
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Resources:
  CVAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cv-analyzer-api
      CodeUri: .
      Handler: lambda_handler.handler
      Description: API para analizar CVs con AWS Bedrock
      Architectures:
        - x86_64
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource:
              - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-*'
              - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*'
      Events:
        RootPath:
          Type: Api
          Properties:
            Path: /
            Method: GET
        AnalyzeCV:
          Type: Api
          Properties:
            Path: /analyze
            Method: POST
        ProxyPath:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  CVAnalyzerApi:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  CVAnalyzerFunction:
    Description: "Lambda Function ARN"
    Value: !GetAtt CVAnalyzerFunction.Arn
  CVAnalyzerFunctionIamRole:
    Description: "IAM Role for Lambda Function"
    Value: !GetAtt CVAnalyzerFunctionRole.Arn
